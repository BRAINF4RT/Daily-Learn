<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Learn</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="icons/icon48.png" alt=""><span>Daily Learn</span></div>
    <button class="btn primary block" id="newBtn" type="button">＋ New briefing</button>
    <input class="search" id="libSearch" type="search" placeholder="Search your library" autocomplete="off">
    <div class="lib-label">Library</div>
    <nav id="library" class="library" aria-label="Past briefings"></nav>
    <div class="side-foot">
      <button class="btn ghost grow" id="settingsBtn" type="button">⚙ Settings</button>
      <button class="icon-btn" id="themeBtn" type="button" title="Switch theme" aria-label="Switch theme">◐</button>
    </div>
  </aside>

  <main class="main" id="main">
    <!-- HOME -->
    <section id="view-home" class="view">
      <div class="hero">
        <h1>What do you want to learn today?</h1>
        <p class="lede">A sourced, plainly explained briefing on any topic. Free sources, and the model of your choice.</p>
        <form id="topicForm" class="topic-box" autocomplete="off">
          <input id="topic" type="text" placeholder="e.g. how vaccines train the immune system" maxlength="200" autofocus>
          <button class="btn primary" id="goBtn" type="submit">Generate</button>
        </form>
        <button class="link" id="surpriseBtn" type="button">✨ Surprise me with today's topic</button>
      </div>
      <div id="banner"></div>
      <div class="panel-grid">
        <div class="panel">
          <h3>Reader level</h3>
          <div class="seg" id="levelSeg"></div>
          <h3 class="mt">Depth</h3>
          <div class="seg" id="depthSeg"></div>
          <p class="hint" id="depthHint"></p>
        </div>
        <div class="panel">
          <h3>Model <span class="status" id="modelStatus"></span></h3>
          <div class="seg" id="providerSeg"></div>
          <select id="modelSelect" aria-label="Model"></select>
          <p class="hint" id="modelHint"></p>
        </div>
        <div class="panel">
          <h3>Options</h3>
          <label class="check"><input type="checkbox" id="optLLM"><span>Write with a language model<small>Off gives sourced excerpts only</small></span></label>
          <label class="check"><input type="checkbox" id="optVideos"><span>Find videos to watch</span></label>
          <label class="check"><input type="checkbox" id="optTranscripts"><span>Read video transcripts<small>Best effort; falls back to descriptions</small></span></label>
          <label class="check"><input type="checkbox" id="optVerify"><span>Check cited sentences against sources</span></label>
        </div>
      </div>
      <div id="recentWrap" hidden>
        <h3 class="section-title">Pick up where you left off</h3>
        <div class="chips" id="recentChips"></div>
      </div>
    </section>

    <!-- RUN -->
    <section id="view-run" class="view" hidden>
      <div class="run-head">
        <div>
          <p class="eyebrow">Building your briefing</p>
          <h2 id="runTopic"></h2>
          <p class="hint" id="runModel"></p>
        </div>
        <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
      </div>
      <ol class="stages" id="stages"></ol>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div>
      <div class="step-line"><span id="stepLabel">Starting…</span><span id="elapsed" class="muted"></span></div>
      <h3 class="section-title">Sources</h3>
      <div class="src-grid" id="srcGrid"></div>
      <h3 class="section-title">Activity</h3>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="alert error" id="runError" hidden></div>
    </section>

    <!-- REPORT -->
    <section id="view-report" class="view wide" hidden>
      <div class="report-bar">
        <button class="btn ghost" id="backBtn" type="button">← New briefing</button>
        <span class="grow"></span>
        <div class="menu-wrap">
          <button class="btn ghost" id="exportBtn" type="button">Export ▾</button>
          <div class="menu" id="exportMenu" hidden>
            <button type="button" data-x="md">Markdown (.md)</button>
            <button type="button" data-x="html">Web page (.html)</button>
            <button type="button" data-x="anki">Anki flashcards (.tsv)</button>
            <button type="button" data-x="json">Sources (.json)</button>
            <hr>
            <button type="button" data-x="copy">Copy Markdown</button>
            <button type="button" data-x="print">Print / save as PDF</button>
          </div>
        </div>
        <button class="btn ghost danger" id="deleteBtn" type="button">Delete</button>
      </div>
      <div class="report-layout">
        <article class="briefing" id="report"></article>
        <aside class="toc" id="toc" aria-label="On this page"></aside>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" hidden></section>
  </main>
</div>

<dialog id="dialog"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
